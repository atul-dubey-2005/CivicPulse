spring.application.name=civicpulse
server.port=${PORT:8080}
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/civicpulse}
spring.datasource.username=${DB_USER:civicpulse}
spring.datasource.password=${DB_PASSWORD:civicpulse}
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=20MB
app.jwt.secret=${JWT_SECRET}
app.jwt.expiration-ms=${JWT_EXPIRATION_MS:3600000}
app.cors-origin=${CORS_ORIGIN:http://localhost:5173}
app.ai-url=${AI_URL:http://localhost:8000}
