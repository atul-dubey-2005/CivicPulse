services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-civicpulse}
      POSTGRES_USER: ${POSTGRES_USER:-civicpulse}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-civicpulse}
    ports: ["5432:5432"]
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./database/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
      - ./database/seed.sql:/docker-entrypoint-initdb.d/02-seed.sql:ro
      - ./database/sample-data.sql:/docker-entrypoint-initdb.d/03-sample-data.sql:ro
    healthcheck:
      test: ["CMD-SHELL","pg_isready -U civicpulse -d civicpulse"]
      interval: 5s
      timeout: 5s
      retries: 10
  ai-service:
    build: ./ai-service
    ports: ["8000:8000"]
  backend:
    build: ./backend
    environment:
      DB_URL: jdbc:postgresql://postgres:5432/civicpulse
      DB_USERNAME: ${POSTGRES_USER:-civicpulse}
      DB_PASSWORD: ${POSTGRES_PASSWORD:-civicpulse}
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET in .env}
      CORS_ORIGIN: http://localhost:5173
      AI_URL: http://ai-service:8000
      UPLOAD_DIR: /app/uploads
    ports: ["8080:8080"]
    volumes:
      - backend_uploads:/app/uploads
    depends_on:
      postgres: {condition: service_healthy}
  frontend:
    image: node:22-alpine
    working_dir: /app
    volumes: ["./frontend:/app"]
    command: sh -c "npm install && npm run dev -- --host 0.0.0.0"
    environment:
      VITE_API_URL: http://localhost:8080/api
    ports: ["5173:5173"]
    depends_on: [backend]
volumes:
  postgres_data:
  backend_uploads:
