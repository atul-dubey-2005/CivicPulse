services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    env_file: .env
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./database/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
      - ./database/seed.sql:/docker-entrypoint-initdb.d/02-seed.sql:ro
      - ./database/sample-data.sql:/docker-entrypoint-initdb.d/03-sample-data.sql:ro
    healthcheck: {test: ["CMD-SHELL","pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"], interval: 5s, timeout: 5s, retries: 10}
  ai-service:
    build: ./ai-service
    restart: unless-stopped
  backend:
    build: ./backend
    restart: unless-stopped
    env_file: .env
    environment:
      DB_URL: jdbc:postgresql://postgres:5432/$${POSTGRES_DB}
      DB_USERNAME: $${POSTGRES_USER}
      DB_PASSWORD: $${POSTGRES_PASSWORD}
      CORS_ORIGIN: $${PUBLIC_FRONTEND_ORIGIN}
      AI_URL: http://ai-service:8000
      UPLOAD_DIR: /app/uploads
    volumes:
      - backend_uploads:/app/uploads
    depends_on: {postgres: {condition: service_healthy}}
  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_URL: $${PUBLIC_API_URL:-http://localhost:8080/api}
    restart: unless-stopped
    ports: ["80:80"]
    depends_on: [backend]
volumes:
  postgres_data: {}
  backend_uploads: {}
